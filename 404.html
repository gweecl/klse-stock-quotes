<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var base = "/klse-stock-quotes";
        var path = window.location.pathname;
        var relativePath = path.startsWith(base) ? path.slice(base.length) : path;
        var target =
          base +
          "/?p=" +
          encodeURIComponent(relativePath + window.location.search) +
          window.location.hash;

        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
